<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Montserrat:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .bg-rect { fill: #000000; }
      .serif-monogram {
        font-family: 'Cinzel', 'Playfair Display', 'Times New Roman', serif;
        font-size: 230px;
        font-weight: 700;
        fill: #ffffff;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .center-badge {
        fill: #000000;
      }
      .brand-banner-text {
        font-family: 'Montserrat', 'Inter', sans-serif;
        font-size: 24px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: 0.22em;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .limited-text {
        font-family: 'Montserrat', 'Inter', sans-serif;
        font-size: 16px;
        font-weight: 600;
        fill: #ffffff;
        letter-spacing: 0.55em;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="40" class="bg-rect" />

  <!-- Monogram AL -->
  <!-- Letter A -->
  <text x="195" y="240" class="serif-monogram">A</text>
  <!-- Letter L -->
  <text x="315" y="240" class="serif-monogram">L</text>

  <!-- Center Horizontal Badge Masking the Middle of AL -->
  <rect x="50" y="222" width="400" height="42" class="center-badge" />

  <!-- Banner Text: AURA CRAFT LABS -->
  <text x="250" y="243" class="brand-banner-text">AURA CRAFT LABS</text>

  <!-- Subtitle: LIMITED -->
  <text x="256" y="365" class="limited-text">LIMITED</text>
</svg>
